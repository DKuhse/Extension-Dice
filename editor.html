<div class="dice-roll-editor">
    <h3>Edit Dice Roll</h3>
    <div class="dice-roll-editor-row">
        <span>Roller</span>
        <strong class="dice-roll-who"></strong>
    </div>
    <label class="dice-roll-editor-row">
        <span>Formula</span>
        <input class="text_pole dice-roll-formula" type="text" inputmode="text" placeholder="2d6+1">
    </label>
    <div class="dice-roll-values"></div>
    <div class="dice-roll-summary">
        <span>Modifier: <strong class="dice-roll-modifier">0</strong></span>
        <span>Total: <strong class="dice-roll-total">0</strong></span>
    </div>
    <div class="dice-roll-error" role="alert"></div>
</div>
